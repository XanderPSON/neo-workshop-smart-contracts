name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Starter and isolated completed path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.5
      - name: Format
        run: forge fmt --check
      # Setup may download the pinned solc compiler; verification below is offline.
      - name: Build and cache compiler
        run: forge build --sizes
      - name: Verify exact intentional TODO failures and supplied base
        run: bash script/verify-workshop.sh starter
      - name: Verify isolated completed path and local transaction receipts
        run: bash script/verify-workshop.sh reference
      - name: Prove regressions are rejected
        run: python3 script/test_verification.py
